name: Playwright BDD Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers with OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright BDD tests
        run: npm test
        env:
          HEADLESS: true
          CI: true

      - name: Upload Reporting Labs Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-labs-html-report
          path: reports/reporting-labs/
          retention-days: 14

      - name: Upload Playwright Test Artifacts (Traces & Screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-artifacts
          path: test-results/
          retention-days: 7
