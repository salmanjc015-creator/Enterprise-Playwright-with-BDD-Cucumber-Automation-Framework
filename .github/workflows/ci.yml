name: Playwright BDD Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run BDD Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers with OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright BDD tests
        run: npm test
        env:
          HEADLESS: true
          CI: true

      - name: Upload Reporting Labs Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-labs-html-report
          path: reports/reporting-labs/
          retention-days: 14

      - name: Deploy Live Test Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/reporting-labs
          destination_dir: ./

      - name: Upload Playwright Test Artifacts on Failure (Traces & Screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-artifacts
          path: test-results/
          retention-days: 7
